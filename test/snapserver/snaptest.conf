[server]
datadir = /tmp/snapserver
mdns_enabled = false
codec = pcm
sampleformat = 48000:16:2
[stream]
#source = process:///ffmpeg?log_stderr=true&codec=pcm&params= -re -stream_loop -1 -i song.mp3 -f s16le -acodec pcm_s16le -ar 48000 - &name=test&controlscript=snap_instrument.py
[http]
port = 1780
enabled = true
publish_http = false
publish_https = false
[tcp-control]
enabled = false
publish = false
[tcp-streaming]
enabled = false
publish = false

[logging]
level = debug
sink = stdout