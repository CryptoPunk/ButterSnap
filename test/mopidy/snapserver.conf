[server]
pidfile = /var/run/snapserver/pid
user = snapserver
group = snapserver
datadir = /var/lib/snapserver
mdns_enabled = true

[http]
enabled = true
port = 1780
bind_to_address = ::
publish_http = true
doc_root = /usr/share/snapserver/snapweb/

[tcp-control]
enabled = true
port = 1705
bind_to_address = ::
publish = true

[tcp-streaming]
enabled = true
port = 1704
bind_to_address = ::
publish = true

[stream]
source = pipe:///tmp/snapfifo?name=mopidy&mode=read&controlscript=meta_mopidy.py
plugin_dir = /usr/share/snapserver/plug-ins
sandbox_dir = /tmp
sampleformat = 48000:16:2
codec = pcm

[logging]
sink = stdout
filter = *:info