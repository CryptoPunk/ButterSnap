<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterSync - Snapcast & Butterchurn Integration</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div id="app">
        <header>
            <div class="logo-area">
                <h1>ButterSync</h1>
                <div id="status-indicator">
                    <span id="status-dot"></span>
                    <span id="status">Disconnected</span>
                </div>
            </div>
            
            <div class="server-controls">
                <input type="text" id="server-url" value="http://localhost:1780" placeholder="Snapserver URL">
                <button id="load-streams-btn">List</button>
                <select id="stream-selector">
                    <option value="">Default Stream</option>
                </select>
                <button id="connect-btn">Connect</button>
            </div>
        </header>

        <main>
            <canvas id="canvas"></canvas>
            
            <div id="metadata-hud" class="hud-panel hidden">
                <img id="album-art" src="" alt="" onerror="this.style.display='none'">
                <div class="track-info">
                    <h2 id="track-title">Ready to Sync</h2>
                    <p id="track-artist">Select a stream and connect</p>
                </div>
            </div>

            <div id="playback-hud" class="hud-panel">
                <div class="playback-controls">
                    <button id="prev-btn" class="icon-btn">⏮</button>
                    <button id="play-pause-btn" class="icon-btn">▶</button>
                    <button id="next-btn" class="icon-btn">⏭</button>
                </div>
                <div class="visual-controls">
                    <select id="preset-selector"><option>Loading...</option></select>
                    <button id="shuffle-btn">Shuffle</button>
                    <select id="scale-selector">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="2.0">2.0x</option>
                    </select>
                    <div class="aa-control">
                        <span>AA</span>
                        <label class="switch">
                            <input type="checkbox" id="aa-checkbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button id="fullscreen-btn">⛶</button>
                </div>
            </div>
        </main>

        <footer>
            <div id="debug-info">
                Latency: <span id="latency">0</span>ms |
                Chunks: <span id="chunk-count">0</span>
            </div>
        </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>

</html>
